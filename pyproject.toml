[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsaea"
version = "0.1.0"
description = "FlowSAEA: ensemble flow matching surrogate for expensive multi-objective evolutionary optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchdiffeq>=0.2.3",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: tests of a single function or module",
    "integration: tests that run the optimization loop end to end",
]

[tool.coverage.run]
source = ["flowsaea"]
